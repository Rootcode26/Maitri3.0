name: maitri-3

services:
  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    container_name: maitri-3-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    ports:
      - "${DB_HOST:?DB_HOST is required}:${DB_PORT:?DB_PORT is required}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready --host=127.0.0.1 --port=5432 --username=$$POSTGRES_USER
          --dbname=$$POSTGRES_DB &&
          psql --host=127.0.0.1 --port=5432 --username=$$POSTGRES_USER
          --dbname=$$POSTGRES_DB --tuples-only --no-align --command='SELECT 1'
          | grep -q '^1$$'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    shm_size: 128mb
    networks:
      - database

  redis:
    image: ${REDIS_IMAGE:?REDIS_IMAGE is required}
    container_name: maitri-3-redis
    restart: unless-stopped
    init: true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --requirepass "$$REDISCLI_AUTH"
    ports:
      - "${REDIS_HOST:?REDIS_HOST is required}:${REDIS_PORT:?REDIS_PORT is required}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli -h 127.0.0.1 -p 6379 ping | grep -q '^PONG$$'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - cache

  minio:
    image: ${MINIO_IMAGE:?MINIO_IMAGE is required}
    container_name: maitri-3-minio
    restart: unless-stopped
    init: true
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    ports:
      - "${S3_HOST:?S3_HOST is required}:${S3_PORT:?S3_PORT is required}:9000"
      - "${S3_HOST:?S3_HOST is required}:${S3_CONSOLE_PORT:?S3_CONSOLE_PORT is required}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD-SHELL, "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - storage

  minio-setup:
    image: ${MINIO_MC_IMAGE:?MINIO_MC_IMAGE is required}
    container_name: maitri-3-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >-
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET"
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    networks:
      - storage

  clamav:
    image: ${CLAMAV_IMAGE:?CLAMAV_IMAGE is required}
    # The official ClamAV image currently publishes amd64 manifests only.
    # Docker Desktop emulates it on Apple Silicon development machines.
    platform: linux/amd64
    container_name: maitri-3-clamav
    restart: unless-stopped
    init: true
    ports:
      - "${CLAMAV_HOST:?CLAMAV_HOST is required}:${CLAMAV_PORT:?CLAMAV_PORT is required}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: [CMD-SHELL, "clamdcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s
    stop_grace_period: 30s
    networks:
      - scanning

volumes:
  postgres_data:
    name: maitri-3-postgres-data
  redis_data:
    name: maitri-3-redis-data
  minio_data:
    name: maitri-3-minio-data
  clamav_data:
    name: maitri-3-clamav-data

networks:
  database:
    name: maitri-3-database
    driver: bridge
  cache:
    name: maitri-3-cache
    driver: bridge
  storage:
    name: maitri-3-storage
    driver: bridge
  scanning:
    name: maitri-3-scanning
    driver: bridge
