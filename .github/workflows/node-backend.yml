name: Node Backend CI

on:
  push:
    paths:
      - node-backend/**
      - .github/workflows/node-backend.yml
  pull_request:
    paths:
      - node-backend/**
      - .github/workflows/node-backend.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: node-backend
    env:
      CI: true
      NODE_ENV: test
      LOG_LEVEL: silent
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: test
      DB_PASSWORD: test
      DB_NAME: test
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: test
      REDIS_DB: 0
      REDIS_URL: redis://:test@localhost:6379/0
      JWT_ACCESS_SECRET: ci-test-access-secret-change-before-production
      JWT_REFRESH_SECRET: ci-test-refresh-secret-change-before-production
      OTP_SECRET: ci-test-otp-secret-change-before-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.26.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: node-backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
