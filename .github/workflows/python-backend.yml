name: Python Backend CI

on:
  push:
    paths:
      - python-backend/**
      - .github/workflows/python-backend.yml
  pull_request:
    paths:
      - python-backend/**
      - .github/workflows/python-backend.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Python backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-contract.txt -r requirements-validation-dev.txt

      - name: Run tests
        run: python -m scripts.run_relevant_tests
