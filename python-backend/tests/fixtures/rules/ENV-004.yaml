id: ENV-004
version: 1

when:
  any:
    - field: operations.handlesHazardousChemicals
      equals: true

    - field: sectorDetails.involvesDyeingOrBleaching
      equals: true

    - field: utilities.generatesHazardousWaste
      equals: true

    - field: utilities.wastewaterDischarge
      in:
        - common_treatment_facility
        - onsite_treatment_plant
        - zero_liquid_discharge

    - field: operations.processesUsed
      in:
        - onsite_effluent_treatment

then:
  recommend: POLLUTION_CONTROL_CONSENT

explanation: "Hazardous chemical use, dyeing or bleaching, hazardous waste, wastewater handling, or effluent treatment indicates that pollution control review is required."

requiredDocuments:
  - pollution_control_plan