{
  "id": "ENV-004",
  "version": 2,
  "when": {
    "any": [
      {
        "field": "sectorDetails.involvesDyeingOrBleaching",
        "applicableIndustries": [
          "textile"
        ],
        "equals": true
      },
      {
        "field": "operations.handlesHazardousChemicals",
        "equals": true
      },
      {
        "field": "utilities.generatesHazardousWaste",
        "equals": true
      },
      {
        "field": "sectorDetails.furnaceType",
        "applicableIndustries": [
          "steel"
        ],
        "in": [
          "induction",
          "electric_arc",
          "cupola"
        ]
      },
      {
        "field": "operations.primaryActivity",
        "in": [
          "dyeing_processing",
          "foundry_casting"
        ]
      }
    ]
  },
  "then": {
    "recommend": "consent-to-operate",
    "scope": "approval",
    "status": "required"
  },
  "explanation": "Pollution indicators warrant MPCB consent review, not an automatic CTO determination. CTE and CTO are distinct; zero discharge does not by itself establish an exemption.",
  "verification": "PROTOTYPE_ASSUMPTION",
  "jurisdiction": "MH",
  "decisionInputs": [],
  "sources": [
    {
      "organization": "MPCB",
      "title": "Consent application information",
      "url": "https://www.mpcb.gov.in/en/consentmgt/water-and-air-act/document"
    }
  ],
  "limitations": [
    "Preliminary screening only; absent decision inputs must be supplied through an owner-approved internal snapshot. No legal exemption is inferred from a non-match."
  ],
  "dependencies": [
    {
      "prerequisite": "consent-to-establish",
      "stage": "operation",
      "external": true,
      "verification": "NEEDS_REVIEW",
      "reason": "CTE precedes establishment for consent-applicable units; applicability/exemptions must be confirmed before activating this dependency.",
      "sources": [
        {
          "organization": "MPCB",
          "title": "Consent application information",
          "url": "https://www.mpcb.gov.in/en/consentmgt/water-and-air-act/document"
        }
      ]
    }
  ],
